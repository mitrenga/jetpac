    <rect x="18" y="36" width="12" height="3"/>
    <rect x="6" y="39" width="9" height="3"/>
    <rect x="18" y="39" width="3" height="3"/>
    <rect x="27" y="39" width="6" height="3"/>
    <rect x="36" y="39" width="3" height="3"/>
    <rect x="6" y="42" width="3" height="3"/>
